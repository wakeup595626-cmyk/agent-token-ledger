name: 功能建议
description: 提议新的来源、图表或桌面体验
title: "[建议] "
labels:
  - enhancement
body:
  - type: input
    id: summary
    attributes:
      label: 建议摘要
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明现有使用方式哪里不够顺畅
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 新来源检测
        - 界面和图表
        - Windows 桌面程序
        - 报告和导出
        - 文档和发布
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认建议中不包含 API Key、Cookie、完整会话正文或未脱敏数据库
          required: true
