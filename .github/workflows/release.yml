name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v

      - name: Build Windows application
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-app.ps1 `
            -NoDesktop `
            -SkipTests `
            -Package `
            -OutputsRoot "$env:GITHUB_WORKSPACE\outputs"

      - name: Create public source archive
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          git archive --format=zip --output="agent-token-ledger-$tag-source.zip" HEAD

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            outputs/*.zip
            outputs/*.sha256
            agent-token-ledger-*-source.zip
